<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Cidade Infinita</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #080808;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #101010;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10;
        background: rgba(0,0,0,.75);
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.7;
        backdrop-filter: blur(8px);
    }

    #info strong {
        color: #fff;
    }

    #hint {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,.75);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 13px;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="info">
    <div><strong>ESCALA DA CIDADE</strong></div>
    <div>Distância original: <span id="distance">100%</span></div>
    <div>Seu tamanho: <span id="size">100%</span></div>
    <div>Passo atual: <span id="step">1.00</span></div>
    <div>Passos nesta etapa: <span id="steps">0</span> / 1000</div>
</div>

<div id="hint">
    ⬆️ / W = andar para a borda
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

/*
    =====================================================
    REGRAS DA CIDADE
    =====================================================

    A cidade tem raio físico FINITO.

    O jogador começa no centro.

    A cada 1000 passos:
        - ele percorre metade da distância restante
        - seu tamanho diminui pela metade
        - seu passo diminui pela metade

    Como tudo ao redor acompanha a escala,
    cada nova metade continua parecendo ter
    aproximadamente 1000 passos.

    =====================================================
*/

const CITY_RADIUS = 1000;

// posição física normalizada:
// 0 = centro
// 1 = borda
let position = 0;

// escala do jogador
let playerScale = 1;

// passo original
const BASE_STEP = 1;

// teclas
const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function movePlayer() {

    if (!(keys["arrowup"] || keys["w"])) {
        return;
    }

    /*
        Quanto menor o jogador,
        menor é seu passo.

        Portanto o passo acompanha
        exatamente a escala.
    */

    const currentStep = BASE_STEP * playerScale;

    /*
        Movimento físico.
    */

    position += currentStep / CITY_RADIUS;

    if (position > 0.999999999) {
        position = 0.999999999;
    }

    /*
        A regra da cidade:

        Conforme você percorre a distância,
        a escala acompanha a distância restante.

        A escala é proporcional ao
        restante da cidade.
    */

    playerScale = 1 - position;

    /*
        Evita chegar matematicamente a zero.
    */

    if (playerScale < 0.000001) {
        playerScale = 0.000001;
    }

    updateUI();
}

function updateUI() {

    const remaining = 1 - position;

    document.getElementById("distance").textContent =
        (remaining * 100).toFixed(6) + "%";

    document.getElementById("size").textContent =
        (playerScale * 100).toFixed(6) + "%";

    document.getElementById("step").textContent =
        playerScale.toFixed(8);

    /*
        Quantos passos foram dados
        na escala atual.
    */

    const stageProgress =
        ((position / (1 - playerScale + 0.000000001)) * 1000);

    document.getElementById("steps").textContent =
        Math.min(1000, Math.floor(stageProgress));
}

function drawCity() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    /*
        Quanto mais perto da borda,
        mais o mundo é comprimido
        para manter a experiência local
        aparentemente normal.
    */

    const visualScale = 0.25 + playerScale * 0.75;

    // ==================================================
    // CÉU / FUNDO
    // ==================================================

    ctx.fillStyle = "#101010";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ==================================================
    // CIDADE
    // ==================================================

    ctx.save();

    ctx.translate(cx, cy);

    /*
        A cidade é circular.
    */

    const cityRadius =
        Math.min(canvas.width, canvas.height) * 0.43;

    ctx.beginPath();
    ctx.arc(0, 0, cityRadius, 0, Math.PI * 2);

    ctx.fillStyle = "#191919";
    ctx.fill();

    ctx.strokeStyle = "#777";
    ctx.lineWidth = 4;
    ctx.stroke();

    /*
        Anéis da cidade.
    */

    for (let r = 0.2; r <= 0.8; r += 0.2) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            cityRadius * r,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    /*
        Ruas radiais.
    */

    for (let i = 0; i < 16; i++) {

        const angle =
            (Math.PI * 2 / 16) * i;

        ctx.beginPath();

        ctx.moveTo(0, 0);

        ctx.lineTo(
            Math.cos(angle) * cityRadius,
            Math.sin(angle) * cityRadius
        );

        ctx.strokeStyle = "#292929";
        ctx.lineWidth = 12;
        ctx.stroke();
    }

    /*
        Prédios.

        Eles diminuem junto com
        a escala do jogador.
    */

    const buildingScale = visualScale;

    for (let i = 0; i < 40; i++) {

        const angle =
            (Math.PI * 2 / 40) * i;

        const radius =
            cityRadius * (0.15 + (i % 5) * 0.12);

        const x =
            Math.cos(angle) * radius;

        const y =
            Math.sin(angle) * radius;

        const w = 35 * buildingScale;
        const h = 55 * buildingScale;

        ctx.fillStyle = "#555";

        ctx.fillRect(
            x - w / 2,
            y - h / 2,
            w,
            h
        );
    }

    ctx.restore();

    // ==================================================
    // JOGADOR
    // ==================================================

    ctx.save();

    ctx.translate(cx, cy);

    /*
        O jogador permanece no centro da câmera.

        A cidade é que parece se mover.
    */

    const playerSize =
        22 * Math.max(playerScale, 0.08);

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        playerSize,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();

    // ==================================================
    // INDICADOR DA BORDA
    // ==================================================

    ctx.fillStyle = "#fff";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "BORDA DA CIDADE",
        cx,
        35
    );
}

function gameLoop() {

    movePlayer();
    drawCity();

    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();

</script>

</body>
</html>
